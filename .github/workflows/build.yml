name: Build & Release Patches

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build patch bundle
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew build

      - name: Get version from patches-bundle.json
        id: get_version
        run: |
          VERSION=$(cat patches-bundle.json | python3 -c "import sys,json; print(json.load(sys.stdin)['version'])" 2>/dev/null || echo "1.0.0")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Delete existing release (if any)
        run: |
          gh release delete latest --yes 2>/dev/null || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release and upload bundle
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Regain Patches (latest)"
          body: "Auto-built patch bundle for Regain v76.1.2139"
          files: |
            build/libs/*.mpp
            patches-bundle.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

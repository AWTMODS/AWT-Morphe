name: Build & Release Patches

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Android patch bundle
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          # GPR_TOKEN must be a PAT with read:packages scope stored in repo secrets
          GITHUB_TOKEN: ${{ secrets.GPR_TOKEN }}
        run: ./gradlew :patches:buildAndroid

      - name: Find built .mpp file
        id: find_mpp
        run: |
          MPP_FILE=$(find . -name "*.mpp" | head -1)
          echo "mpp_file=$MPP_FILE" >> $GITHUB_OUTPUT
          echo "Found: $MPP_FILE"
          ls -la $(dirname $MPP_FILE) || true

      - name: Get patch version
        id: get_version
        run: |
          # Extract version from build output or use default
          VERSION=$(find . -name "*.mpp" | head -1 | grep -oP '\d+\.\d+\.\d+' | head -1 || echo "1.0.0")
          VERSION=$(find . -name "*.mpp" | head -1 | grep -oP '\d+\.\d+\.\d+' | head -1 || true)
          if [ -z "$VERSION" ]; then
            VERSION="1.0.0"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Update patches-bundle.json with real download URL
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          MPP_FILE="${{ steps.find_mpp.outputs.mpp_file }}"
          FILENAME=$(basename "$MPP_FILE")
          CREATED_AT=$(date -u +"%Y-%m-%dT%H:%M:%S")
          cat > patches-bundle.json << EOF
          {
            "created_at": "$CREATED_AT",
            "description": "Morphe patches for Regain (ai.regainapp)",
            "download_url": "https://github.com/AWTMODS/AWT-Morphe/releases/download/latest/$FILENAME",
            "version": "$VERSION"
          }
          EOF
          cat patches-bundle.json

      - name: Delete existing latest release (if any)
        run: gh release delete latest --yes 2>/dev/null || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete existing latest tag (if any)
        run: git push origin :refs/tags/latest 2>/dev/null || true

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "AWT Morphe (latest)"
          body: |
            Auto-built patch bundle for **Regain v76.1.2139**
            
            Add this source URL in Morphe:
            `https://raw.githubusercontent.com/AWTMODS/AWT-Morphe/main/patches-bundle.json`
          files: |
            ${{ steps.find_mpp.outputs.mpp_file }}
            patches-bundle.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit updated patches-bundle.json back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add patches-bundle.json
          git diff --cached --quiet || git commit -m "chore: update patches-bundle.json [skip ci]"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

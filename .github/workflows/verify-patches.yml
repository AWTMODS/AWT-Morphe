name: Verify Morphe patch bundle

on:
  # Build within the contributor's fork. This avoids GitHub's upstream
  # first-time-contributor approval gate for pull_request workflows.
  push:
    branches:
      - feature/regain-gmscore-support
    paths:
      - ".github/workflows/verify-patches.yml"
      - "patches/**"
      - "extensions/**"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - "gradle.properties"

  # Re-run manually from the fork's Actions tab when needed.
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  build:
    name: Compile Morphe patch bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Build patch bundle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :patches:buildAndroid --no-daemon

name: Verify Morphe patch bundle

on:
  # Run inside the contributor's fork on every update to this feature branch.
  # This avoids the upstream fork-PR approval gate while still building the same commit.
  push:
    branches:
      - feature/regain-gmscore-support
    paths:
      - ".github/workflows/verify-patches.yml"
      - "patches/**"
      - "extensions/**"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - "gradle.properties"

  # Keep upstream PR validation enabled; an AWTMODS maintainer must approve
  # this run before GitHub executes it against the base repository.
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/verify-patches.yml"
      - "patches/**"
      - "extensions/**"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - "gradle.properties"

  # Allows manual re-validation from the fork's Actions tab.
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  build:
    name: Compile Morphe patch bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Build patch bundle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :patches:buildAndroid --no-daemon

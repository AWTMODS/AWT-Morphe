name: Verify Morphe patch bundle

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/verify-patches.yml"
      - "patches/**"
      - "extensions/**"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - "gradle.properties"

permissions:
  contents: read
  packages: read

jobs:
  build:
    name: Compile Morphe patch bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Build patch bundle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :patches:buildAndroid --no-daemon
